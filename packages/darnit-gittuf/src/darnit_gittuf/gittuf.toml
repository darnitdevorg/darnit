[metadata]
name = "gittuf"
display_name = "Gittuf Policy Checks"
version = "0.1.0"
spec_version = "gittuf v0.1"
description = "Security policy checks using Gittuf"

[mcp]
name = "gittuf"
description = "Run Gittuf policy checks on a repository"

[mcp.tools.audit_gittuf]
builtin = "audit"
description = "Run Gittuf policy checks"

[context.gittuf_root_key]
type = "string"
prompt = "Which existing SSH key should hold the initial gittuf root authority? Provide its absolute local path, never private key contents."
affects = ["GT-01.01"]
store_as = "gittuf_root_key"
auto_detect = false
allow_sieve_hints = false
required = true

# =============================================================================
# Control: Is Gittuf initialized in this repo?
# =============================================================================

[controls."GT-01.01"]
name = "GittufInitialized"
description = "Repository has Gittuf initialized"
tags = { level = 1, domain = "GT" }
help_md = """For a new gittuf installation, confirm `gittuf_root_key` through
`confirm_project_data` using the absolute local path to the maintainer's existing
SSH private key, never its contents or a `.pub` path. Install git, gittuf, and
ssh-keygen on PATH and configure Git author and committer identity.

Signing must be non-interactive: use an unencrypted key or unlock it in ssh-agent
before starting Darnit, with the agent available to that process. This remediation
does not support interactive passphrase entry.

Approve GT-01.01 remediation to initialize, stage, and apply the root of trust
locally. Setup refuses to run if any refs/gittuf/* exist. It leaves HEAD, Git
configuration, and working-tree files untouched. Branch policies and additional
key holders remain maintainer decisions; nothing is pushed.
"""

[[controls."GT-01.01".passes]]
handler = "exec"
# With --quiet a missing ref exits 1; without it, 128, the code git also uses for "not a git repository".
command = ["git", "show-ref", "--verify", "--quiet", "refs/gittuf/policy"]
pass_exit_codes = [0]
fail_exit_codes = [1]
timeout = 10

[[controls."GT-01.01".passes]]
handler = "manual"
steps = [
    "Run: git show-ref --verify refs/gittuf/policy",
    "Verify the command exits with code 0",
    "If it fails, Gittuf has not been initialized in this repo",
    "To initialize: use GT-01.01 remediation with a confirmed root signing key",
]

[controls."GT-01.01".remediation]
safe = false
requires_context = [{key = "gittuf_root_key", required = true}]

[[controls."GT-01.01".remediation.handlers]]
handler = "gittuf_initialize"

# =============================================================================
# Control: Is the Gittuf policy valid?
# =============================================================================

[controls."GT-01.02"]
name = "GittufPolicyValid"
description = "Gittuf policy passes verification"
tags = { level = 1, domain = "GT" }

[[controls."GT-01.02".passes]]
handler = "gittuf_verify_policy"

[[controls."GT-01.02".passes]]
handler = "manual"
steps = [
    "Run: gittuf verify-ref HEAD",
    "Verify the command exits with code 0",
    "Check output for any policy violations",
]

# =============================================================================
# Control: Are commits signed?
# =============================================================================

[controls."GT-02.01"]
name = "CommitsSigned"
description = "Recent commits are cryptographically signed"
tags = { level = 2, domain = "GT" }

[[controls."GT-02.01".passes]]
handler = "gittuf_commits_signed"

[[controls."GT-02.01".passes]]
handler = "manual"
steps = [
    "Run: git log --show-signature -5",
    "Verify each commit shows a valid GPG or SSH signature",
    "Check that no commits show 'BAD signature'",
]
