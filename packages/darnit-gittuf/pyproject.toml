[project]
name = "darnit-gittuf"
version = "0.1.0"
description = "Gittuf policy checks plugin for darnit"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Kusari", email = "info@kusari.dev" },
]
keywords = ["security", "compliance", "gittuf", "git", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "darnit>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/kusari-oss/darnit"
Repository = "https://github.com/kusari-oss/darnit"
Issues = "https://github.com/kusari-oss/darnit/issues"

[project.entry-points."darnit.implementations"]
gittuf = "darnit_gittuf:register"

[project.entry-points."darnit.frameworks"]
gittuf = "darnit_gittuf:get_framework_path"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darnit_gittuf"]