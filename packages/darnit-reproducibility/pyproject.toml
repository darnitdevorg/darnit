[project]
name = "darnit-reproducibility"
version = "0.1.1"
description = "Transitional package: darnit-reproducibility is now darnit-amber"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Kusari", email = "info@kusari.dev" },
]
keywords = ["security", "compliance", "reproducibility", "research", "artifacts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "darnit-amber==0.1.1",
]

# No entry points on purpose. Installing this package upgrades the old
# darnit-reproducibility 0.1.1 (whose entry points no longer load against
# this darnit-core) to a shell that only pulls in darnit-amber. It ships for
# one release after the rename (#532); after that, uninstall it.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darnit_reproducibility"]
