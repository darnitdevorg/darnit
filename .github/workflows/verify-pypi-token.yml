name: Verify PyPI Token

# Manual-only sanity check for the `PYPI_API_TOKEN` repo secret. Useful when
# you rotate the token, add per-project tokens, or debug a release-time auth
# failure without having to cut a real tag.
#
# What it does: builds a throwaway wheel whose metadata claims a package name
# you don't own on PyPI (django), then attempts to upload it. Two possible
# outcomes:
#   - Token is bad: pypi-publish action reports an authentication error
#     (403 with "Invalid or non-existent authentication").
#   - Token is good: pypi-publish action reports an authorization error
#     (403 with "isn't allowed to upload to project 'django'") -- exactly the
#     signal we want. Auth passed, ownership check rejected as expected.
#
# Nothing gets published either way; both outcomes are failures from
# pypi-publish's perspective, so this workflow will always end with a red X.
# Read the log to distinguish auth-bad from auth-good.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify PYPI_API_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"

      - name: Build throwaway wheel with a name we do not own
        run: |
          set -euo pipefail
          mkdir -p src/django
          touch src/django/__init__.py
          cat > src/pyproject.toml <<'EOF'
          [project]
          name = "django"
          version = "0.0.0.dev1"
          [build-system]
          requires = ["setuptools>=61"]
          build-backend = "setuptools.build_meta"
          EOF
          python -m pip install --quiet build
          python -m build --wheel --outdir dist src

      - name: Attempt upload (expected to fail on ownership when token is good)
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: false
          verbose: true

      - name: How to read the result
        run: |
          {
            echo "## Read the previous step's log"
            echo
            echo "- **Token is valid** if the error mentions **not allowed to upload to project 'django'**. Auth passed; ownership rejected as expected."
            echo "- **Token is invalid or missing** if the error mentions **Invalid or non-existent authentication information**. Regenerate the token, re-add \`PYPI_API_TOKEN\`, rerun."
            echo "- **Any other outcome**: paste the log into the PR that changed this workflow so it can be interpreted."
          } >> "$GITHUB_STEP_SUMMARY"
