name: Container Smoke

# Builds the container image from the pull request's checkout (linux/amd64,
# not pushed) and runs scripts/container-image-smoke.sh against it: every
# framework loads, the bundled tools run, an audit of the mounted checkout
# keeps the repository identity (#586), and the MCP server answers.
#
# No token is passed to the container, so the audit's platform checks are not
# measured here; the script asserts the identity only.

on:
  pull_request:
    paths:
      - 'packaging/container/**'
      - 'packages/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.dockerignore'
      - 'scripts/container-image-smoke.sh'
      - '.github/workflows/container-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Build the image (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: packaging/container/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: darnit:smoke
          build-args: |
            IMAGE_VERSION=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Smoke-test the image
        run: scripts/container-image-smoke.sh darnit:smoke .
