name: Container Edge Build

# Rolling :edge container build on every push to main. Unsigned, no SBOM,
# no PyPI dependency. For development/testing use only — production CI/CD
# should pin to :vX.Y.Z or :latest.
#
# The :edge image builds darnit from the checkout (packaging/container/
# Dockerfile, the same one the release uses), so it ships main.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'packaging/container/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.dockerignore'
      - '.github/workflows/container-edge.yml'

permissions:
  contents: read

jobs:
  build-edge:
    name: Build and push :edge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase owner)
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/darnit"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build and push :edge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: packaging/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}:edge
          build-args: |
            IMAGE_VERSION=${{ github.sha }}
          # No cosign signing for :edge. Users who pull :edge are
          # accepting an unsigned rolling build for development.
          provenance: false
          sbom: false
