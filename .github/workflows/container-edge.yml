name: Container Edge Build

# Rolling :edge container build on every push to main. Unsigned, no SBOM,
# no PyPI dependency. For development/testing use only — production CI/CD
# should pin to :vX.Y.Z or :latest.
#
# The :edge image installs darnit from the working tree (not from PyPI),
# so it can ship code that has not yet been released.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'packaging/container/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'packaging/pypi/public-packages.txt'
      - '.dockerignore'
      - '.github/workflows/container-edge.yml'

permissions:
  contents: read

jobs:
  build-edge:
    name: Build and push :edge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Compute image name (lowercase owner)
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/darnit"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.5.0"
          enable-cache: false

      # The Dockerfile installs the darnit wheels from dist/ in the build
      # context, in the layout release.yml produces. Build them here from the
      # working tree, so :edge ships the code on main and does not depend on
      # a published release.
      - name: Build wheels from the working tree
        id: edge_version
        run: |
          set -euo pipefail
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "::group::Building $pkg"
            uv build --package "$pkg" --out-dir "dist/$pkg"
            echo "::endgroup::"
          done < packaging/pypi/public-packages.txt
          version=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' pyproject.toml)
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from pyproject.toml"
            exit 1
          fi
          echo "Building :edge from the working tree at version ${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Log in only after the wheels are built: uv build runs the project's
      # build backend, and a bad build-dependency release must not find a
      # registry credential on this runner (review on #519).
      - name: Authenticate to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :edge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: packaging/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}:edge
          build-args: |
            VERSION=${{ steps.edge_version.outputs.version }}
          # No cosign signing for :edge. Users who pull :edge are
          # accepting an unsigned rolling build for development.
          provenance: false
          sbom: false
