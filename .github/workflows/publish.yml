name: Publish to PyPI

# NOTE: This workflow is a placeholder and not yet active.
# To enable: uncomment the release trigger below and configure
# PyPI Trusted Publishing at https://pypi.org/manage/account/publishing/

on:
  workflow_dispatch:  # Manual trigger only for now
  # release:
  #   types: [published]

# Restrict permissions to minimum required at workflow level
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.0"

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build packages
        run: |
          uv build --package darnit-core
          uv build --package darnit-baseline

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: dist
          path: dist/

  publish-darnit-core:
    name: Publish darnit-core
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for trusted publishing and Sigstore signing
      contents: read
      attestations: write  # Required for Sigstore attestations

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          name: dist
          path: dist/

      - name: Publish darnit-core to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true  # Sign with Sigstore

  publish-darnit-baseline:
    name: Publish darnit-baseline
    needs: publish-darnit-core
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for trusted publishing and Sigstore signing
      contents: read
      attestations: write  # Required for Sigstore attestations

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          name: dist
          path: dist/

      - name: Publish darnit-baseline to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true  # Sign with Sigstore
