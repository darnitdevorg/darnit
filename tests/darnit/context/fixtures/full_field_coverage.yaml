# Feature 030 fixture: exercises every .project/project.yaml field that
# darnit's `dot_project.py` reader currently exposes on `ProjectConfig`,
# using representative values that survive a golden-dict comparison.
#
# Notes on shape choices (deliberate, not incidental):
#   - `project_lead` uses the NEW upstream LIST form so the reader's
#     scalar-or-list coercer (T003-T004) is exercised on every CI run.
#   - `package_managers` uses the LIST form for at least one registry so
#     the coercer's map-value path (T005) is exercised on every CI run.
#   - `cncf_slack_channel` uses the OLD YAML key so the deprecation
#     warning (T006) fires on every CI run; the paired warning-assertion
#     test lives in T016.
#   - `slack_channels` is deliberately NOT included in this file to keep
#     the golden dict small; NEW-IGNORED capture behavior is verified via
#     `test_extra_captures_slack_channels` (see T015).

