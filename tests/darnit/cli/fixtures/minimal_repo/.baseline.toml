extends = "testchecks"

# These three testchecks controls have pass_if_any=false on "no forbidden
# pattern in **/*.py" checks. The handler's pass_if_any=false semantics
# require every pattern to MATCH (not "must not match"), so a clean
# hello.py fails them by design. Disabling here so the golden-path
# fixture produces zero FAIL results. This is a fixture concern only;
# no production behavior is affected.
[controls."TEST-QA-01"]
status = "disabled"
reason = "testchecks pass_if_any=false semantics do not fit fixture; see feature 024 spec"

[controls."TEST-QA-02"]
status = "disabled"
reason = "testchecks pass_if_any=false semantics do not fit fixture; see feature 024 spec"

[controls."TEST-SEC-01"]
status = "disabled"
reason = "testchecks pass_if_any=false semantics do not fit fixture; see feature 024 spec"
