# Test-only framework holding the RFC-0001 Stage 1 reference control
# (feature 025 T044). It exercises a dispositive file_exists step followed
# by a suggestive llm_extract step, using built-in step types only.
#
# It used to ship in openssf-baseline.toml, where every OSPS audit counted
# it as a Level 1 control (#466). It lives here so the authority tests keep
# their reference control without it appearing in any real audit.

[metadata]
name = "stage1-reference"
display_name = "RFC-0001 Stage 1 reference (test only)"
version = "0.0.0"
spec_version = "test"

[controls."STAGE1-REF-SECURITY-01"]
name = "SecurityPolicyReference"
level = 1
domain = "VM"
description = "RFC-0001 Stage 1 reference control: SECURITY.md discovery + LLM-suggested contact"

# Dispositive file_exists first, so the suggestive llm_extract step is
# reached only when no policy file is found and file_exists did not conclude.
[[controls."STAGE1-REF-SECURITY-01".passes]]
handler = "file_exists"
files = [
    "SECURITY.md", "security.md",
    ".github/SECURITY.md", ".github/security.md",
    "docs/SECURITY.md", "docs/security.md",
]
authority = "dispositive"

[[controls."STAGE1-REF-SECURITY-01".passes]]
handler = "llm_extract"
prompt = "Scan the repository's README and documentation for security-contact information. Propose a contact string suitable for a SECURITY.md."
files = ["README.md", "README", "docs/**/*.md"]
target_key = "security_contact"
authority = "suggestive"
