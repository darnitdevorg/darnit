# False PASS results the shipped Baseline TOML produces on this corpus.
#
# The corpus gate (test_corpus.py) fails on any false PASS by a step allowed
# to conclude PASS, except the entries listed here. An entry that no longer
# occurs also fails the gate, so this list can only shrink. User Story 5
# (Baseline re-declaration, T045-T047) emptied it; SC-001 requires it to
# stay empty for openssf-baseline (tests/darnit_baseline/test_baseline_authority.py).
#
# Each entry names the framework, fixture, control, step index (the
# control's pass index; omit for inferred_from), the concluding handler, the
# task that removes it, and why the PASS is false:
#
# [[known]]
# framework = "openssf-baseline"
# fixture = "<fixture directory>"
# control = "OSPS-XX-00.00"
# step = 0
# handler = "<handler>"
# task = "<task id>"
# why = "<why the PASS is false>"
